[package]
name = "linkedin"
version = "0.1.0"
edition = "2021"
authors = ["Aron Reis"]
license = "GPL-3.0-only"
description = "Fast, Unix-composable LinkedIn CLI and automation tool written in Rust using CDP"
repository = "https://github.com/aronreisx/linkedin-cli"
keywords = ["linkedin", "cli", "automation", "cdp", "browser"]
categories = ["command-line-utilities"]

[lib]
name = "linkedin"
path = "src/lib.rs"

[[bin]]
name = "linkedin"
path = "src/main.rs"


[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chromiumoxide = "0.9"
clap = { version = "4.5", features = ["derive", "env", "string"] }
clap_complete = "4.5"
clap_mangen = "0.2"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
url = "2.5"
regex = "1.10"
keyring = "3.6"
crossterm = "0.28"
minijinja = "2.0"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
percent-encoding = "2.3"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"

