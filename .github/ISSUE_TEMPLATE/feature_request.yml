name: 💡 Feature Request
description: Suggest an idea or new command for LinkedIn CLI
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new capability, flag, or workflow? Let us know!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the limitation is.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Command Syntax
      description: How should this command or feature work? Example command-line invocation.
      placeholder: |
        e.g. `linkedin ...`
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
