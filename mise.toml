[tools]
rust = "stable"

[tasks.run]
description = "Run headless LinkedIn CLI"
run = "cargo run --"

[tasks."run:headed"]
description = "Run LinkedIn CLI in headed mode"
run = "cargo run -- --headed"

[tasks."run:debug"]
description = "Launch Chrome/Chromium with remote debugging port 9222 for DevTools/MCP inspection"
run = """
if [ -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ]; then
  CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
elif command -v google-chrome >/dev/null 2>&1; then
  CHROME="google-chrome"
elif command -v chromium >/dev/null 2>&1; then
  CHROME="chromium"
elif command -v chromium-browser >/dev/null 2>&1; then
  CHROME="chromium-browser"
else
  echo "Error: Neither Google Chrome nor Chromium was found on this system." >&2
  exit 1
fi

echo "Launching Chrome with remote debugging on port 9222 for DevTools/MCP inspection..."
exec "$CHROME" \
  --remote-debugging-port=9222 \
  --disable-blink-features=AutomationControlled \
  --no-first-run \
  --no-default-browser-check \
  --user-data-dir="${LINKEDIN_CLI_USER_DATA_DIR:-${HOME}/.linkedin-cli/profiles/default}" \
  "https://www.linkedin.com"
"""

[tasks.lint]
description = "Lint the codebase with Clippy"
run = "cargo clippy -- -D warnings"

[tasks.test]
description = "Run test suite"
run = "cargo test"
